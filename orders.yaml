openapi: 3.0.4
info:
  title: Orders API
  description: >-
    Read-only API exposing customers (with embedded address and orders) and
    orders. Spec generated by observing live responses from the sample
    APIConnect environment.


    Note: in the observed environment the `limit`, `id`, and `status` query
    parameters are accepted (HTTP 200) but do not change the response body —
    every call returns the full collection. They are documented here as the
    intended filtering/pagination contract.
  version: 1.0.0
servers:
  - url: https://sample-api.eu-west-a.apiconnect.automation.ibm.com
    description: APIConnect sample environment (eu-west-a)
tags:
  - name: customers
    description: Customer records with embedded address and orders
  - name: orders
    description: Order records
paths:
  /api/customers:
    get:
      tags:
        - customers
      operationId: listCustomers
      summary: List customers
      description: >-
        Returns the collection of customers, each with an embedded address and
        their orders.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of customers to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            example: 10
        - name: id
          in: query
          required: false
          description: Filter to the customer with this identifier.
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: A list of customers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
  /api/orders:
    get:
      tags:
        - orders
      operationId: listOrders
      summary: List orders
      description: Returns the collection of orders.
      parameters:
        - name: status
          in: query
          required: false
          description: Filter orders by fulfilment status.
          schema:
            type: string
            enum:
              - PENDING
              - SHIPPED
              - DELIVERED
              - CANCELLED
            example: SHIPPED
      responses:
        '200':
          description: A list of orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
components:
  schemas:
    Customer:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Lucas Bill
        email:
          type: string
          format: email
          example: lucas.bill@example.com
        address:
          $ref: '#/components/schemas/Address'
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
      required:
        - id
        - name
        - email
        - address
        - orders
    Address:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        street:
          type: string
          example: 999 Croissant Bl
        city:
          type: string
          example: Boston
        stateProvince:
          type: string
          example: Massachusetts
        postalCode:
          type: string
          example: '02122'
        countryRegion:
          type: string
          description: Country or region code.
          example: US
      required:
        - id
        - street
        - city
        - stateProvince
        - postalCode
        - countryRegion
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 19
        customerId:
          type: integer
          format: int64
          example: 1
        carrier:
          type: string
          example: ups
        trackingId:
          type: string
          example: 1Z881F5V0397269080
        shippingCost:
          type: integer
          format: int32
          example: 2
        createdAt:
          type: string
          format: date
          example: '2020-08-04'
      required:
        - id
        - customerId
        - carrier
        - trackingId
        - shippingCost
        - createdAt
