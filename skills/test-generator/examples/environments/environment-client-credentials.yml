kind: environment
apiVersion: api.ibm.com/v1
metadata:
  name: <api-name>-environment
  namespace: <namespace>
  version: "1.0"
  tags: []
spec:
  variables:
    # Use when the policy sequence contains extract-identity, authenticate,
    # or authorize policies. Supply at runtime:
    #   --env client_id=${CLIENT_ID},client_secret=${CLIENT_SECRET}
    - key: client_id
      isSecret: true
      value: ""
    - key: client_secret
      isSecret: true
      value: ""
