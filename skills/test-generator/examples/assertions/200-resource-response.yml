kind: assertion
apiVersion: api.ibm.com/v1
metadata:
  name: 200-<resource>-response
  namespace: <namespace>
  version: "1.0"
  tags:
    - assertion
spec:
  - name: Validate response status code
    key: responseStatus
    value: 200
    action: equals
    stopOnFail: false
  - name: Validate content type
    key: responseHeaders.content-type
    value: application/json
    action: equals
    stopOnFail: false
  - name: Validate response schema
    key: responseBody
    value: '<compact JSON schema string from components.schemas>'
    action: validateSchema
    stopOnFail: false
  - name: "Validate required property: <field>"
    key: responseBody
    value: <field>
    action: haveProperty
    stopOnFail: false
