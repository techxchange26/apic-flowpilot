# Complete Workflow — API with Extract Identity / Authenticate / Authorize policies
#
# Context: The project's policy sequence contains extract-identity, authenticate,
# and/or authorize policies. The gateway validates the caller's identity using a
# client_id and client_secret. The user provided:
#   CLIENT_ID     → their registered application client ID
#   CLIENT_SECRET → the matching client secret
#
# Endpoint confirmed by user: http://gateway:9090/api/myapi/1.0
#
# Execution command:
#   apic test MyApiProject \
#     --names dev:myapi-test:1.0 \
#     --localDir /path/to/projects \
#     --endpoints http://gateway:9090/api/myapi/1.0 \
#     --env client_id=${CLIENT_ID},client_secret=${CLIENT_SECRET}
#
# If the API also requires a bearer token (e.g., it has an OAuth2 securityScheme
# in addition to the policy chain), pass all credentials together:
#   --env bearer_token=${BEARER_TOKEN},client_id=${CLIENT_ID},client_secret=${CLIENT_SECRET}
#
# Files generated for this workflow:
#   tests/myapi-test.yaml                            (this file)
#   tests/environments/myapi-environment.yml
#   tests/assertions/200-success.yml
#   tests/assertions/201-created.yml
#   tests/assertions/400-bad-request.yml
#   tests/assertions/401-unauthorized.yml

kind: test
apiVersion: api.ibm.com/v1
metadata:
  name: myapi-test
  namespace: dev
  version: "1.0"
  tags: []
spec:
  api:
    $endpoint: http://gateway:9090/api/myapi/1.0
  request:
    - method: POST
      resource: /items
      headers:
        - key: content-type
          value: application/json
        - key: X-IBM-Client-Id
          value: ${client_id}
        - key: X-IBM-Client-Secret
          value: ${client_secret}
      payload:
        raw:
          json: |-
            {"name": "sample-item", "description": "test item"}
      parameters: []
      assertions:
        - $ref: dev:201-created:1.0

    - method: GET
      resource: /items
      headers:
        - key: X-IBM-Client-Id
          value: ${client_id}
        - key: X-IBM-Client-Secret
          value: ${client_secret}
      parameters: []
      assertions:
        - $ref: dev:200-success:1.0

  environment:
    $ref: dev:myapi-environment:1.0
